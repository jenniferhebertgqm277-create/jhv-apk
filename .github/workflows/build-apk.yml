name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - id: ver
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npm run prepare-web
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b4a8f' --iconBackgroundColorDark '#0b4a8f'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JHV-v${{ steps.ver.outputs.v }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JHV-apk
          path: JHV-v*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: JHV v${{ steps.ver.outputs.v }}
          files: JHV-v${{ steps.ver.outputs.v }}.apk
          generate_release_notes: true
